<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>People of Gandhinagar · Walk the city, meet Gandhinagaris</title>
    <meta name="description" content="A living 3D Gandhinagar. Walk LDRP campus and Mahatma Mandir, ride, stop for chai and meet real people." />
    <meta name="theme-color" content="#0b1116" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="People of Gandhinagar" />
    <meta property="og:description" content="A living 3D Gandhinagar. Walk, ride, stop for chai and meet real people." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Start the heavy downloads before any script runs. -->
    <link rel="preload" href="/data/gandhinagar-live.json?v=20261126-districts2" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/premium.css" />
    <link rel="stylesheet" href="/src/game-shell.css" />
    <style>
      #loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:#0b2027;color:#edf2e7;font-family:Inter,system-ui;transition:opacity .35s}
      #loading.done{opacity:0;pointer-events:none}
      #loading .ld{width:min(320px,86vw);text-align:center}
      #loading h1{font-size:22px;font-weight:600;letter-spacing:-.04em;margin:8px 0 30px}
      .metro-loader{height:65px;position:relative;overflow:hidden;margin-bottom:25px}
      .metro-track{position:absolute;bottom:9px;left:0;right:0;height:3px;background:#73968a;border-bottom:1px solid #395e54}
      .metro-track:after{content:'';position:absolute;top:8px;left:0;width:100%;height:1px;background:repeating-linear-gradient(90deg,#426b5c 0 10px,transparent 10px 20px)}
      .metro-train{position:absolute;bottom:12px;left:0;display:flex;gap:3px;animation:metro-pass 2.7s linear infinite;will-change:transform}
      .metro-car{position:relative;display:flex;gap:4px;align-items:flex-start;padding:7px 7px 10px;width:60px;height:29px;background:#dce5db;border-top:4px solid #dfbd7a;border-radius:4px 4px 2px 2px;box-sizing:border-box}
      .metro-car:first-child{border-radius:13px 4px 2px 2px}.metro-car:last-child{border-radius:4px 13px 2px 2px}.metro-car:after{content:'';position:absolute;left:9px;right:9px;bottom:-4px;height:6px;border-left:7px solid #8aa198;border-right:7px solid #8aa198}.metro-car i{width:10px;height:8px;background:#2f585b;border-radius:1px}
      #loading .bar{height:3px;background:#ffffff14;border-radius:3px;overflow:hidden}#loading .bar i{display:block;height:100%;width:4%;background:#b9d5b8;transition:width .25s}
      #loading .meta{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#93afa1;font-size:10px;line-height:1.5;text-align:left}#loading .meta p{margin:0}#loading .meta b{font-weight:500;color:#cbdcc9;white-space:nowrap}
      #loading .ld>p{font:14px/1.6 Inter,system-ui;color:#cbdcc9}.startup-retry{margin-top:18px;min-height:46px;padding:12px 22px;border:0;border-radius:12px;background:#e8c98e;color:#183b40;font:600 14px Inter,system-ui;cursor:pointer}
      @keyframes metro-pass{from{transform:translateX(-190px)}to{transform:translateX(330px)}}
      @media(prefers-reduced-motion:reduce){.metro-train{animation:none;left:50%;transform:translateX(-50%)}#loading .bar i{transition:none}}
    </style>
    <link rel="stylesheet" href="/src/welcome.css" />
    <link rel="preload" href="/art/gog-city.svg" as="image" />
    <script type="module" src="/src/ui/landscape.js"></script>
  </head>
  <body>
    <audio id="gog-theme" src="/audio/gog-theme.mp3" preload="none" loop playsinline crossorigin="anonymous"></audio>
    <style>
      #music-choice{width:min(370px,calc(100vw - 36px));max-height:calc(100dvh - 32px);overflow:auto;padding:26px;border:1px solid #91b9a666;border-radius:20px;background:#102e33;color:#edf2e7;font:14px/1.6 Inter,system-ui;box-shadow:0 20px 70px #0006}
      #music-choice::backdrop{background:#06171be0}#music-choice h2{font-size:22px;line-height:1.3;margin:0 0 10px}#music-choice p{color:#b8cdc5;margin:0 0 22px}
      #music-choice .music-actions{display:flex;gap:10px}#music-choice button{flex:1;min-height:46px;padding:10px;border:1px solid #bed3c84d;border-radius:12px;font:600 14px Inter,system-ui;background:#1b4344;color:#edf2e7;cursor:pointer}
      #music-choice #music-yes{background:#e8c98e;color:#183b40}#music-choice button:focus-visible{outline:3px solid #fff;outline-offset:3px}
      #music-mute,#music-enable{position:fixed;z-index:125;right:max(16px,env(safe-area-inset-right));min-height:40px;padding:9px 13px;border:1px solid #b5f2cd66;border-radius:12px;background:#142e28ed;color:#e9fff1;font:600 12px system-ui;cursor:pointer}#music-mute{top:76px}#music-enable{bottom:100px}
    </style>
    <dialog id="music-choice" aria-labelledby="music-title" aria-describedby="music-description">
      <h2 id="music-title">Would you like to play music?</h2>
      <p id="music-description">Enjoy the city with its soundtrack. You can mute it anytime.</p>
      <div class="music-actions"><button id="music-yes" type="button" autofocus>Yes, play music</button><button id="music-no" type="button">No, continue quietly</button></div>
    </dialog>
    <button id="music-mute" type="button" hidden aria-label="Mute music" aria-pressed="false">♫ On</button>
    <button id="music-enable" type="button" hidden>♪ Tap to resume music</button>
    <script src="/audio/theme-player.js"></script>
    <div id="app"></div>
    <div id="labels"></div>
    <div id="loading" role="status" aria-live="polite">
      <div class="ld">
        <h1>Gandhinagar loading…</h1>
        <div class="metro-loader" aria-hidden="true"><div class="metro-track"></div><div class="metro-train"><span class="metro-car"><i></i><i></i><i></i></span><span class="metro-car"><i></i><i></i><i></i></span><span class="metro-car"><i></i><i></i><i></i></span></div></div>
        <div class="bar"><i></i></div>
        <div class="meta"><p>Waking up the city…</p><b>0%</b></div>
      </div>
    </div>
    <noscript>People of Gandhinagar needs JavaScript and WebGL to run.</noscript>
    <script type="module" src="/src/startup.js"></script>
  </body>
</html>
